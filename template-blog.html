<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="../../assets/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../assets/favicon.jpg" type="image/jpg">
    <link rel="stylesheet" href="../../assets/atom-one-dark.min.css">
    <link rel="stylesheet" href="../../assets/css/v5-font-face.min.css">
    <link rel="stylesheet" href="../../assets/css/all.min.css">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{KEYWORDS}}">
    <!-- Open Graph / SEO -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://tsmr.eu{{URL}}">
    <link rel="canonical" href="https://tsmr.eu{{URL}}">
</head>

<body>
    <div class="container">
        <a href="../../index.html" style="text-decoration: none;">
            <h1 id="header" style="color: #fff;display: flex;">
                <div class="block">T</div>
                <div class="block">S</div>
                <div class="block">M</div>
                <div class="block">R</div>
            </h1>
        </a>
        <p style="text-align: center;margin: 6px 0;"><small>Something with IT security</small></p>
        <div class="social-links">
            <a href="https://github.com/otsmr" class="social-link" title="GitHub"><i
                    class="fa-brands fa-github"></i></a>
            <a href="https://codeberg.org/tsmr" class="social-link codeberg" title="Codeberg"></a>
            <a rel="me" href="https://infosec.exchange/@tsmreu" class="social-link" title="Mastodon"><i
                    class="fa-brands fa-mastodon"></i></a>
            <a href="/rss.xml" class="social-link" title="RSS Feed"><i class="fa-solid fa-rss"></i></a>
        </div>
        <br />
        <br />
        <br />
        <br />

        <div class="blog-post">
            <div style="text-align: center;">
                {{LINKS}}
            </div>
            {{BODY}}
        </div>
    </div>

    <footer>
        <ul class="links">
            <li><a href="../../index.html">Home</a></li>
            <li><a href="../../privacy.html">Privacy</a></li>
        </ul>
    </footer>

    <script src="../../assets/highlight.min.js"></script>
    <script src="../../assets/mouse-effect.js"></script>
    <script>hljs.highlightAll();</script>
    <script defer src="https://umami.twonly.eu/script.js"
        data-website-id="6bfb452a-f508-4f2e-9b5b-69141a445ea7"></script>
    <script>
        if (document.querySelector('.mermaid')) {
            const script = document.createElement('script');
            script.src = '../../assets/mermaid.min.js';
            script.onload = () => {
                mermaid.initialize({
                    startOnLoad: true,
                    theme: 'dark',
                    sequence: {
                        useMaxWidth: false,
                        actorFontSize: 10,
                        noteFontSize: 10,
                        messageFontSize: 10,
                    }
                });
            };
            document.body.appendChild(script);
        }
    </script>
</body>

</html>
